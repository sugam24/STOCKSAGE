[project]
name = "stocksage"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "google-genai>=2.12.1",
    "pydantic-settings>=2.14.2",
    "yfinance>=1.5.2",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
markers = [
    "integration: marks tests that make live API calls (deselect with '-m not integration')",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

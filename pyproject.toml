[project]
name = "stocksage"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "chromadb>=1.5.9",
    "fastapi>=0.143.0",
    "flashrank>=0.2.10",
    "groq>=0.30.0",
    "httpx>=0.28.1",
    "langchain>=1.4.4",
    "langchain-groq>=1.1.3",
    "langgraph>=1.2.14",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "plotly>=7.1.0",
    "pydantic-settings>=2.14.2",
    "rank-bm25>=0.2.2",
    "requests>=2.34.2",
    "sentence-transformers>=5.7.0",
    "streamlit>=1.65.0",
    "tavily-python>=0.7.27",
    "uvicorn>=0.54.0",
    "websockets>=16.1",
    "yfinance>=1.5.2",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
markers = [
    "integration: marks tests that make live API calls (deselect with '-m not integration')",
]

[tool.pyright]
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
extraPaths = [".", "src"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

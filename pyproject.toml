[project]
name = "stocksage"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "groq>=1.6.0",
    "pydantic-settings>=2.14.2",
    "sentence-transformers>=5.7.0",
    "tavily-python>=0.7.27",
    "yfinance>=1.5.2",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
markers = [
    "integration: marks tests that make live API calls (deselect with '-m not integration')",
]

[tool.pyright]
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
extraPaths = ["."]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]
